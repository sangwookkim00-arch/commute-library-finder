<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hybrid Preview - 출퇴근 도서관 책찾기</title>
    <link rel="stylesheet" href="/hybrid/styles.css">
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="brand-row">
          <div class="brand-mark">4</div>
          <div>
            <p class="eyebrow">Gangnam to Gireum</p>
            <h1>출퇴근 도서관</h1>
          </div>
        </div>
        <span class="preview-label">Hybrid</span>
      </header>

      <section class="search-card" aria-label="책 검색">
        <div class="route">
          <span>강남역</span>
          <i></i>
          <b></b>
          <i></i>
          <span>길음역</span>
        </div>
        <h2>오늘 빌릴 책, 가까운 도서관부터</h2>
        <p class="helper">8개 구 도서관에서 지금 대출 가능한 곳만 추려봅니다.</p>

        <form id="searchForm" class="search-form">
          <label for="keyword">책 제목 또는 ISBN13</label>
          <div class="search-control">
            <input id="keyword" name="keyword" type="search" autocomplete="off" placeholder="자본주의 편의점">
            <button id="submitButton" type="submit">검색</button>
          </div>
        </form>

        <div class="districts" aria-label="검색 대상 구">
          <span>강남</span>
          <span>서초</span>
          <span>동작</span>
          <span>용산</span>
          <span>중구</span>
          <span>종로</span>
          <span>성북</span>
          <span>강북</span>
        </div>
      </section>

      <p id="status" class="status" role="status">책 제목을 입력해 주세요.</p>

      <section class="section">
        <div class="section-head">
          <div>
            <p>Step 1</p>
            <h2>책 후보</h2>
          </div>
          <span id="bookCount">0권</span>
        </div>
        <div id="bookList" class="stack">
          <div class="empty">검색하면 책 후보가 여기에 표시됩니다.</div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div>
            <p>Step 2</p>
            <h2>대출 가능 도서관</h2>
          </div>
          <span id="libraryCount">0곳</span>
        </div>
        <div id="libraryList" class="stack">
          <div class="empty">책을 선택하면 도서관 목록이 표시됩니다.</div>
        </div>
      </section>
    </main>

    <script src="/hybrid/app.js"></script>
  </body>
</html>
