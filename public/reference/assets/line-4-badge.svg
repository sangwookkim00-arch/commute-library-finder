<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Seoul subway line 4 badge</title>
  <desc id="desc">A blue subway line badge inspired by Seoul subway line 4.</desc>
  <defs>
    <linearGradient id="line4" x1="12" x2="84" y1="14" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6fe7ff"/>
      <stop offset="0.55" stop-color="#27b9e7"/>
      <stop offset="1" stop-color="#3b63ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#051231" flood-opacity="0.28"/>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="42" fill="url(#line4)" filter="url(#shadow)"/>
  <circle cx="48" cy="48" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.86" stroke-width="5"/>
  <path d="M23 66C36 43 55 56 72 31" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="7"/>
  <circle cx="23" cy="66" r="5" fill="#ffffff"/>
  <circle cx="72" cy="31" r="5" fill="#ffffff"/>
  <text x="48" y="57" fill="#132443" font-family="Arial, sans-serif" font-size="38" font-weight="900" text-anchor="middle">4</text>
</svg>
