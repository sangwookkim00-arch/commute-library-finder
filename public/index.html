<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>출퇴근 도서관 책찾기</title>
    <link rel="stylesheet" href="/reference/styles.css">
  </head>
  <body>
    <main class="phone-app">
      <section class="hero-screen">
        <header class="topbar">
          <div class="line-badge" aria-label="4호선 출퇴근 라인">
            <img src="/reference/assets/line-4-badge.svg" alt="4호선">
          </div>
          <button class="icon-button" type="button" aria-label="알림">●</button>
        </header>

        <p class="greeting">오늘의 책 픽업</p>
        <h1>퇴근길에 빌릴 책을<br>가장 예쁜 경로로 찾아요</h1>

        <form id="routeForm" class="route-form">
          <label for="startStation">출퇴근 경로</label>
          <div class="station-fields">
            <input id="startStation" name="startStation" list="stationOptions" autocomplete="off" value="강남" placeholder="출발역">
            <input id="endStation" name="endStation" list="stationOptions" autocomplete="off" value="길음" placeholder="도착역">
            <button id="routeButton" type="submit">Route</button>
          </div>
          <datalist id="stationOptions"></datalist>
        </form>

        <form id="searchForm" class="search-form">
          <label for="keyword">책 검색</label>
          <div class="search-field">
            <input id="keyword" name="keyword" type="search" autocomplete="off" placeholder="책 제목, ISBN13">
            <button id="submitButton" type="submit">Search</button>
          </div>
        </form>

        <div class="route-card">
          <span id="routeStart">강남</span>
          <i></i>
          <b id="routeDistrictCount">경로 계산 중</b>
          <i></i>
          <span id="routeEnd">길음</span>
        </div>

        <div class="section-title">
          <h2>Book shelf</h2>
          <span id="bookCount">0 books</span>
        </div>
        <div id="bookShelf" class="book-shelf">
          <article class="placeholder-card">검색하면 책 표지가 여기에 나타납니다.</article>
        </div>

        <div id="districtGrid" class="genre-grid" aria-label="검색 대상 구">
          <span>경로</span>
          <span>계산</span>
          <span>대기</span>
          <span>중</span>
        </div>
      </section>

      <section class="detail-screen">
        <p id="status" class="status">책 제목을 입력해 주세요.</p>
        <div id="selectedBook" class="selected-book empty-detail">
          <p>책을 선택하면 상세와 대출 가능 도서관이 표시됩니다.</p>
        </div>

        <div class="section-title compact">
          <h2>Available libraries</h2>
          <span id="libraryCount">0 places</span>
        </div>
        <div id="libraryList" class="library-list">
          <article class="library-empty">도서관 결과 대기 중</article>
        </div>
      </section>

      <nav class="bottom-nav" aria-label="미리보기 내비게이션">
        <span class="active">Home</span>
        <span>Search</span>
        <span class="center">Book</span>
        <span>Library</span>
        <span>Route</span>
      </nav>
    </main>

    <script src="/reference/app.js"></script>
  </body>
</html>
