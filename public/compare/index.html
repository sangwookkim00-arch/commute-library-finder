<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>디자인 비교 - 출퇴근 도서관 책찾기</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #18221f;
        background: #eef5f1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1480px, 100%);
        margin: 0 auto;
        padding: 24px 16px 32px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0;
      }

      p {
        margin: 6px 0 0;
        color: #65736d;
      }

      .links {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      a {
        border-radius: 999px;
        padding: 9px 12px;
        background: white;
        color: #0b6f55;
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 8px 24px rgba(24, 34, 31, 0.08);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .preview {
        min-width: 0;
      }

      .preview h2 {
        margin: 0 0 10px;
        font-size: 16px;
      }

      .phone {
        height: 760px;
        overflow: hidden;
        border: 10px solid #18221f;
        border-radius: 34px;
        background: white;
        box-shadow: 0 18px 48px rgba(24, 34, 31, 0.16);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      @media (max-width: 860px) {
        header {
          display: block;
        }

        .links {
          margin-top: 12px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .phone {
          height: 720px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>모바일 디자인 비교</h1>
          <p>Hybrid는 앱 느낌과 또렷한 카드감을 합친 후보입니다.</p>
        </div>
        <div class="links">
          <a href="/react" target="_blank">React만 보기</a>
          <a href="/tailwind" target="_blank">Tailwind만 보기</a>
          <a href="/hybrid" target="_blank">Hybrid만 보기</a>
        </div>
      </header>

      <section class="grid">
        <article class="preview">
          <h2>Hybrid 시안</h2>
          <div class="phone">
            <iframe src="/hybrid" title="Hybrid 시안"></iframe>
          </div>
        </article>
        <article class="preview">
          <h2>React 시안</h2>
          <div class="phone">
            <iframe src="/react" title="React 시안"></iframe>
          </div>
        </article>
        <article class="preview">
          <h2>Tailwind 시안</h2>
          <div class="phone">
            <iframe src="/tailwind" title="Tailwind 시안"></iframe>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
